            - generic [ref=f105e211]:
              - generic [ref=f105e212]: When will I get my order?
              - generic [ref=f105e213]:
                - text: If you place your order today, it should leave our plant in Pennsylvania in
                - strong [ref=f105e214]: 14-17 Days
                - text: (or just 3 Business Days with a FastTrack Fee). Once it does, you'll receive a shipment notification email with tracking & an estimated delivery date. Transit time from PA varies from 1 to 7 business days, depending on your location.
            - generic [ref=f105e215]:
              - generic [ref=f105e216]: How much is U.S. shipping?
              - generic [ref=f105e217]:
                - paragraph [ref=f105e218]:
                  - text: In the contiguous U.S., a DiamondBack cover or ATV/SXS Carrier ships
                  - strong [ref=f105e219]: free
                  - text: of charge. In AK & HI, a cover ships for $400.
                - paragraph [ref=f105e220]: Orders that do not include a DiamondBack cover ship at a FedEx or UPS Ground rate calculated at checkout.
