        - generic [ref=f45e626]:
          - generic [ref=f45e627]: Frequently asked questions
          - generic [ref=f45e630]:
            - generic [ref=f45e631] [cursor=pointer]: What is the coating on a DiamondBack?
            - paragraph [ref=f45e633]:
              - strong [ref=f45e634]: The coating we use is the exact same spray-on bedliner material used by Ford, Toyota and others for their new trucks before they leave the factory.
              - text: The largest truck manufacturers have identified this material as the highest-quality coating on the market due to it being the most durable and hardest spray-on coating available. It’s easy to clean and resistant to gasoline, diesel fuel, chlorine and paint. Plus it is environmentally friendly with 100% solids and VOC Free.
          - generic [ref=f45e635]:
            - generic [ref=f45e636] [cursor=pointer]: What's the difference between Rugged Black and Smooth Black finish?
            - paragraph [ref=f45e638]:
              - strong [ref=f45e639]: The difference is the aluminum underneath the spray-on coating.
              - text: Rugged Black features diamond plate aluminum and Smooth Black features smooth plate aluminum.
          - generic [ref=f45e640]:
            - generic [ref=f45e641] [cursor=pointer]: Can you open and close the tailgate without opening a DiamondBack?
            - paragraph [ref=f45e643]:
              - strong [ref=f45e644]: Yes.
              - text: Because DiamondBack covers rest on top of the cargo box’s rails, bulkhead and tailgate and do not engage with the tailgate, opening and closing your tailgate while the cover is closed will be no issue. Even with a load on top of the cover. Auto-opening the tailgate via key fob may not work.
          - generic [ref=f45e645]:
            - generic [ref=f45e646] [cursor=pointer]: Can I stand or walk on my DiamondBack SE, DiamondBack 270, or DiamondBack 180?
            - paragraph [ref=f45e648]:
              - strong [ref=f45e649]: Yes.
              - text: Those covers are rated at 400 lbs, so as long as you do not exceed that limit, you are good to stand or walk on top.
          - generic [ref=f45e650]:
            - generic [ref=f45e651] [cursor=pointer]: Are the hinges vulnerable to tampering due to them being on top of the cover w/ the bolts exposed?
            - paragraph [ref=f45e653]:
              - strong [ref=f45e654]: Not as vulnerable as you may think.
              - text: We utilize flat-head machine screws and nylon lock-nuts to fasten our hinges to the cover. The nylon lock-nuts make it very difficult to loosen the screw from the topside of the cover only.
          - generic [ref=f45e655]:
            - generic [ref=f45e656] [cursor=pointer]: Does a DiamondBack make my truck bed hot?
            - paragraph [ref=f45e658]:
              - strong [ref=f45e659]: A DiamondBack cover will make the inside of your bed hotter than if it wasn't there.
              - text: Anytime you remove flowing air from a space, the temperature in that space is more likely to rise, just as it is in your truck’s cab.
          - generic [ref=f45e660]:
            - generic [ref=f45e661] [cursor=pointer]: Do you have local, stocking dealers near me?
            - paragraph [ref=f45e663]:
              - strong [ref=f45e664]: We do not have any stocking dealers.
              - text: DiamondBackCovers.com is the only authorized retailer, unless otherwise stipulated. For questions on ordering, contact us at 1-800-935-4002.
          - generic [ref=f45e665]:
            - generic [ref=f45e666] [cursor=pointer]: Does the cover come with all its weatherstrip already on?
            - paragraph [ref=f45e668]:
              - strong [ref=f45e669]: Yes, with one exception.
              - text: In addition to the neoprene gasket that’s pre-affixed around the perimeter of your DiamondBack truck bed cover, most late-model pickups will need a single piece of weatherstrip applied to the top of the cargo box bulkhead before the DiamondBack is installed. This piece of weather strip is shipped along with every cover we sell.
          - generic [ref=f45e670]:
            - generic [ref=f45e671] [cursor=pointer]: How hard is it to install a DiamondBack?
            - paragraph [ref=f45e673]:
              - strong [ref=f45e674]: Not hard.
              - text: You’ll need to know how to use a hex key, a socket wrench, and in the case of DiamondBack 270s and DiamondBack 180s, a drill. It also helps to have a second person present. Please have a look at our
              - link "installation guides" [ref=f45e675] [cursor=pointer]:
                - /url: https://diamondbackcovers.com/pages/installation-guides
              - text: for more details.
          - generic [ref=f45e676]:
            - generic [ref=f45e677] [cursor=pointer]: Can DiamondBack ship to my house?
            - paragraph [ref=f45e679]:
              - strong [ref=f45e680]: Yes.
              - text: In fact, we ship to houses more than to any other kind of destination. Since a delivery signature will be required, the freight carrier will call ahead to schedule a half-day appointment when they know someone will be home to sign.
