                    - generic [ref=f45e1139]:
                      - generic [ref=f45e1140]: I love Diamondback covers and had zero issues with the HD on my old Tacoma. This one fits my Ranger Raptor oddly. For the money, I had hoped there would be a hard-material strip included at the bulkhead where Ford left a >1" height difference. Instead, there was only a self-adhesive foam strip. So I'm going to hit Metals Supermarket for some aluminum or McMaster-Carr for some plastic to fill that in before I bother sealing everything, when time allows. The rear corners also fit strangely. Ford rounded this area, so the cover's position has to walk an ultra-fine line between not overlapping the tailgate enough for the seal to engage and sticking past the corners so far that it looks stupid. I had expected larger corner bevels to accommodate this and was surprised to see what appears to be the same geometry that was on my more-square Tacoma cover. I'm also not a fan of the new spring-loaded front latch mechanism. I'm sure it's that way because of perceived fly-open risks. But lowering the front leaf just for it to slam down on the bars because you're not simultaneously twisting the lever is pretty annoying. The bedliner on my last cover looked a lot better than this one. For some reason, this one is shiny in spots. I doubt anyone else notices. But it's just disappointing to see it. Other than those unfortunate things, it's still a great cover that will perform its job quite well for many years, once I get some extra materials to finish the job.
                      - paragraph [ref=f45e1155]: Yes, I recommend this product.
